<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="./styles/calculator.css" />
  </head>
  <body>
    <p class="show-calculation"></p>

    <button class="digit" onclick="updateCalculation('1')">1</button>

    <button class="digit" onclick="updateCalculation('2')">2</button>

    <button class="digit" onclick="updateCalculation('3')">3</button>

    <button class="operator" onclick="updateCalculation(' + ')">+</button>

    <br /><br />

    <button class="digit" onclick="updateCalculation('4')">4</button>

    <button class="digit" onclick="updateCalculation('5')">5</button>

    <button class="digit" onclick="updateCalculation('6')">6</button>

    <button class="operator" onclick="updateCalculation(' - ')">-</button>

    <br /><br />

    <button class="digit" onclick="updateCalculation('7')">7</button>

    <button class="digit" onclick="updateCalculation('8')">8</button>

    <button class="digit" onclick="updateCalculation('9')">9</button>

    <button class="operator" onclick="updateCalculation(' * ')">*</button>

    <br /><br />

    <button class="digit" onclick="updateCalculation('0')">0</button>

    <button class="digit" onclick="updateCalculation('.')">.</button>

    <button
      class="digit"
      onclick="
        calculation = eval(calculation);
        // console.log(calculation);
        document.querySelector('.show-calculation').innerHTML = calculation;

        localStorage.setItem('calculation', calculation);
      "
    >
      =
    </button>

    <button class="operator" onclick="updateCalculation(' / ')">/</button>

    <br /><br />

    <button
      class="digit clear"
      onclick="
        calculation = '';
        console.log('Cleared.');
        document.querySelector('.show-calculation').innerHTML = 0;
        // localStorage.setItem('calculation', calculation);
        localStorage.removeItem('calculation');
      "
    >
      Clear
    </button>

    <script src="./JS-files/calculator.js"></script>
  </body>
</html>
