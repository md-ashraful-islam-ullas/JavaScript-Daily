<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" class="js-name-input" onkeydown="handleNameKeyDown(event)">
    <button class="js-submit-button" onclick="fetchName()">Submit</button>
    <p class="js-show-name"></p>

    <script>
        function fetchName() {
            const inputElement = document.querySelector('.js-name-input').value;

            document.querySelector('.js-show-name').innerHTML = `Your name is: ${inputElement}`;
        }

        function handleNameKeyDown(event) {
            if (event.key === 'Enter') {
                fetchName();
            }
        }


        
    </script>
</body>
</html>
