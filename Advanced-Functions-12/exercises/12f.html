<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="showText()">Add to Cart</button>
    <p class="js-output-show"></p>


    <script>
        let timeOutId;

        function showText() {
            clearTimeout(timeOutId);
            timeOutId = setTimeout(function() {
                document.querySelector('.js-output-show').innerHTML = '';
            }, 2000)
            document.querySelector('.js-output-show').innerHTML = 'Added';
        }
    </script>
</body>
</html>
