<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <button class="js-button">Add to Cart</button>
    <p class="js-output-show"></p>

    <script>
      function showText() {
        setTimeout(() => {
          document.querySelector(".js-output-show").innerHTML = "";
        }, 2000);
        document.querySelector(".js-output-show").innerHTML = "Added";
      }

      document.querySelector(".js-button").addEventListener("click", () => {
        showText();
      });
    </script>
  </body>
</html>
