<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>(1) New Massages</title>
</head>
<body>

    <button onclick="addMessage()">Add</button>
    <button onclick="removeMessage()">Remove</button>
    <script>
        let messages = 2;

        function addMessage() {
            messages++;
        }

        function removeMessage() {
            if (messages > 0) messages--;
        }

        setInterval(function() {
            if (messages > 0) document.title = `(${messages})  New Massages`;
            else document.title = `App`;
        }, 500);
    </script>
</body>
</html>
