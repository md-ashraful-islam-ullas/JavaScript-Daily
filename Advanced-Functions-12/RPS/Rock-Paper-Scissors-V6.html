<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="RPS.css" />
  </head>
  <body>
    <p class="title">Rock Paper Scissors</p>

    <button class="move-button js-rock-button">
      <img class="rps-img" src="../images/Rock.png" alt="" />
    </button>

    <button class="move-button js-paper-button">
      <img class="rps-img" src="../images/Paper.png" alt="" />
    </button>

    <button class="move-button js-scissors-button">
      <img class="rps-img" src="../images/Scissors.png" alt="" />
    </button>

    <p class="js-result final-result"></p>

    <p class="js-moves"></p>

    <p class="js-score score"></p>

    <button class="reset-button js-reset-button">Reset Score</button>

    <button class="auto-play-button js-autoplay-button">Auto Play</button>

    <p class="js-reset-confirmation"></p>

    <script src="RPS.js"></script>
  </body>
</html>
